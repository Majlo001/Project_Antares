<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Antares Ticket</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        .ticket-container {
            width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .text-container {
            padding-bottom: 184px;
        }
        .ticket-text {
            float: left;
            text-align: left;
            width: 420px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            margin: 10px 0;
            font-size: 16px;
            color: #555;
        }
        .ticket-qr {
            float: left;
            margin-left: 20px;
            width: 160px;
        }
        .ticket-qr img {
            width: 160px;
            height: 160px;
        }
    </style>
</head>
<body>
    <div class="ticket-container">
        <h1><span th:text="${eventName}"></span></h1>

        <div class="text-container">
            <div class="ticket-text">
                <p>Seat: <span th:text="${seatNumber}"></span></p>
                <p>Row: <span th:text="${seatRow}"></span></p>
                <p>Sector: <span th:text="${seatSector}"></span></p>
                <p>Ticket type: <span th:text="${ticketType}"></span></p>
                <p>Price: <span th:text="${price}"></span>0 PLN</p>
                <p>Date: <span th:text="${date}"></span></p>
            </div>
            <div class="ticket-qr">
                <img th:src="${qrCodeBase64}" alt="QR Code"/>
            </div>
        </div>
    </div>
</body>
</html>
